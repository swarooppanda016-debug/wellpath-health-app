name: Extract WellPath ZIP

on:
  workflow_dispatch:

# Allow the GitHub Action to push changes
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract WellPath ZIP
        run: |
          echo "Creating extraction folder..."
          rm -rf extracted
          mkdir -p extracted

          echo "Extracting ZIP..."
          unzip -o wellpath-starter.zip -d extracted

          echo "Files extracted:"
          find extracted -maxdepth 4 -type f | sort

          echo "Copying project files..."
          cp -r extracted/. .

          echo "Removing temporary folder..."
          rm -rf extracted

          echo "Project files are ready."

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract WellPath project"
            git push
          fi
