name: Extract WellPath ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract WellPath
        run: |
          unzip -o wellpath-starter.zip -d extracted

          cp -r extracted/wellpath/* .
        

          rm -rf extracted
          rm -f wellpath-starter.zip

      - name: Commit WellPath files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Extract WellPath application" || echo "Nothing to commit"
          git push
